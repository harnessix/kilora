[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kilora-editor-chunk"
version = "0.1.0"
description = "The chunked live editor for KiLoRA: forward-only writes along direction packs"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "harnessix" }]
dependencies = ["kilora>=0.1.0"]

[project.entry-points."kilora.editors"]
chunk = "kilora_editor_chunk:PLUGIN"

[project.scripts]
kilora-editor-chunk = "kilora_editor_chunk.build:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kilora_editor_chunk"]
