---
job: extension
config:
  name: "my_kilora_mod"
  process:
    - type: "kilora_trainer"
      training_folder: "output"
      device: cuda:0
      network:
        type: "kilora"
        linear: 16
        linear_alpha: 16
        network_kwargs:
          mod_id: "my-kilora-mod"
          mod_name: "My KiLoRA mod"
          license: "CC-BY-4.0"
          content_source: "original"
      save:
        dtype: float32
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/path/to/images"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          resolution: [ 1024 ]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "Tongyi-MAI/Z-Image"
        arch: "zimage"
        quantize: true
        low_vram: true
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        prompts:
          - "a lighthouse on a cliff at dawn, wide view"
          - "a small cafe on a rainy street at night"
        neg: ""
        seed: 4711
        walk_seed: true
        guidance_scale: 4
        sample_steps: 25
meta:
  name: "[name]"
  version: "1.0"
