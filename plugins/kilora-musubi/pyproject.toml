[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kilora-musubi"
version = "0.1.0"
description = "Train static KiLoRA mods with musubi-tuner"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "harnessix" }]
dependencies = ["kilora>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kilora_musubi"]
