[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kilora-editor-delta"
version = "0.1.0"
description = "Minimal KiLoRA editor API example: a fixed delta rule on recorded statistics"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "harnessix" }]
dependencies = ["kilora>=0.1.0"]

[project.entry-points."kilora.editors"]
path-write = "kilora_editor_delta:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/kilora_editor_delta"]
