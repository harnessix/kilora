[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kilora-pullback"
version = "0.1.0"
description = "Example KiLoRA editor: pulls the live state back toward the shipped state"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "harnessix" }]
dependencies = ["kilora>=0.1.0"]

[project.entry-points."kilora.editors"]
pullback = "kilora_pullback:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/kilora_pullback"]
