[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kilora"
version = "0.0.11"
description = "Keyed, iterative and composable low-rank adapters for diffusion models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "harnessix" }]
keywords = ["lora", "diffusion", "comfyui", "adapter", "z-image"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "safetensors>=0.4",
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/harnessix/kilora"
Homepage = "https://harnessix.github.io/kilora-site/"
Documentation = "https://github.com/harnessix/kilora/tree/main/docs"
"Bug Tracker" = "https://github.com/harnessix/kilora/issues"

[project.optional-dependencies]
diffusers = ["diffusers>=0.36"]
dev = ["pytest>=8", "ruff>=0.6", "peft>=0.17", "pillow>=9"]

[project.scripts]
kilora = "kilora.cli:main"
kilora-train = "kilora.train:main"
kilora-train-editor = "kilora.trainers:editor_main"

[tool.comfy]
PublisherId = "harnessix"
DisplayName = "KiLoRA"
Icon = "https://harnessix.github.io/kilora-site/assets/icon.svg"
Banner = "https://harnessix.github.io/kilora-site/assets/banner.png"
requires-comfyui = ">=0.44.1"

[tool.hatch.build.targets.wheel]
packages = ["src/kilora"]

[tool.hatch.build.targets.sdist]
include = ["/src/kilora", "/tests", "/LICENSE", "/NOTICE", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "compat-corpus"]
pythonpath = ["examples/editor-delta/src", "plugins/kilora-editor-chunk/src"]
markers = [
    "gpu: needs a GPU (CUDA or ROCm)",
    "lora_parity: plain LoRA import parity against Diffusers",
    "old_mod_corpus: files from earlier releases still load and match",
    "async_live: runs live writes in the background queue",
    "perf: timing checks, run only with KILORA_PERF=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["kilora_editor_delta"]

